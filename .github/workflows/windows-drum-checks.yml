name: Windows drum checks
on:
  push:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-drum-checks.yml'
  pull_request:
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-drum-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Compare drum scoring and audio algorithms against Swift fixtures
        run: |
          $tests = Get-ChildItem Windows -Filter '*.test.mjs' | ForEach-Object { $_.FullName }
          node --test $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check desktop tabs and restored custom exercise workflows
        run: |
          $domRoot = Join-Path $env:RUNNER_TEMP 'drumtrainer-dom-check'
          npm install --prefix $domRoot --no-save --package-lock=false --ignore-scripts jsdom@26
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:DRUMTRAINER_TEST_MODULES = Join-Path $domRoot 'node_modules'
          foreach ($mode in @('builtIn','custom','sequence')) {
            node Windows/validation/check-desktop-dom.mjs $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test included PowerShell launcher
        shell: powershell
        run: ./Windows/launcher.test.ps1
      - name: Build portable package without personal data
        run: python Windows/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: DrumTrainer-Windows-preview
          path: Windows/dist/DrumTrainer-Windows.zip
